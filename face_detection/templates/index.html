<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReMind - Memory Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .video-section {
            position: relative;
        }

        .video-section h2 {
            margin-bottom: 15px;
            color: #667eea;
        }

        #videoFeed {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .info-panel {
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        .info-panel h2 {
            margin-bottom: 20px;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .person-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .person-card h3 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .person-card .relationship {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .person-card .confidence {
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .info-section {
            margin-bottom: 25px;
        }

        .info-section h4 {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .info-section h4::before {
            content: "📋";
            margin-right: 8px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-item strong {
            color: #667eea;
            display: inline-block;
            min-width: 120px;
        }

        .important-info {
            background: #fff3cd;
            border-left-color: #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .important-info h4 {
            color: #856404;
            margin-bottom: 10px;
        }

        .important-info p {
            color: #856404;
        }

        .topics-list {
            list-style: none;
        }

        .topics-list li {
            background: #e7f3ff;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #2196F3;
        }

        .topics-list li strong {
            color: #2196F3;
        }

        .no-person {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .no-person h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status-recognized {
            background: #d4edda;
            color: #155724;
        }

        .status-unknown {
            background: #f8d7da;
            color: #721c24;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }

        .stat-box .label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        /* Scrollbar styling */
        .info-panel::-webkit-scrollbar {
            width: 8px;
        }

        .info-panel::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .info-panel::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .info-panel::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 ReMind</h1>
            <p>Memory Assistant for Dementia Care</p>
        </header>

        <div class="main-content">
            <!-- Video Feed Section -->
            <div class="card video-section">
                <h2>📹 Live Camera Feed</h2>
                <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Video Feed">
            </div>

            <!-- Person Information Panel -->
            <div class="card info-panel">
                <h2>👤 Person Information</h2>
                <div id="personInfo">
                    <div class="no-person loading">
                        <h3>Initializing...</h3>
                        <p>Please wait while the system starts up</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update person information every second
        function updatePersonInfo() {
            fetch('/api/current_person')
                .then(response => response.json())
                .then(data => {
                    const personInfoDiv = document.getElementById('personInfo');

                    if (data.status === 'no_person' || data.status === 'unknown') {
                        personInfoDiv.innerHTML = `
                            <div class="no-person">
                                <h3>${data.status === 'no_person' ? 'No Face Detected' : 'Unknown Person'}</h3>
                                <p>${data.status === 'no_person'
                                    ? 'Waiting for someone to appear in the camera...'
                                    : 'This person is not enrolled in the system'}</p>
                            </div>
                        `;
                    } else if (data.status === 'recognized') {
                        const person = data.person;
                        const encounters = data.encounters;

                        let html = `
                            <div class="person-card">
                                <h3>${person.name}</h3>
                                <div class="relationship">${person.relationship || 'Unknown Relationship'}</div>
                                <div class="confidence">Match: ${person.match_confidence?.toFixed(1)}%</div>
                            </div>
                        `;

                        // Important Information
                        if (person.important_info) {
                            html += `
                                <div class="important-info">
                                    <h4>⚠️ Important Information</h4>
                                    <p>${person.important_info}</p>
                                </div>
                            `;
                        }

                        // Contact Information
                        if (person.phone || person.email) {
                            html += `
                                <div class="info-section">
                                    <h4>Contact Information</h4>
                            `;
                            if (person.phone) {
                                html += `<div class="info-item"><strong>Phone:</strong> ${person.phone}</div>`;
                            }
                            if (person.email) {
                                html += `<div class="info-item"><strong>Email:</strong> ${person.email}</div>`;
                            }
                            html += `</div>`;
                        }

                        // Statistics
                        html += `
                            <div class="info-section">
                                <h4>Visit Statistics</h4>
                                <div class="stats-grid">
                                    <div class="stat-box">
                                        <div class="number">${encounters.total_visits || 0}</div>
                                        <div class="label">Total Visits</div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="number">${encounters.last_seen ? '✓' : '-'}</div>
                                        <div class="label">Last Seen: ${encounters.last_seen || 'First visit'}</div>
                                    </div>
                                </div>
                            </div>
                        `;

                        // Recent Topics
                        if (encounters.common_topics && encounters.common_topics.length > 0) {
                            html += `
                                <div class="info-section">
                                    <h4>Recent Discussion Topics</h4>
                                    <ul class="topics-list">
                            `;
                            encounters.common_topics.forEach(topic => {
                                html += `
                                    <li>
                                        <strong>${topic.topic}</strong>
                                        ${topic.category ? `<br><small>Category: ${topic.category}</small>` : ''}
                                        <br><small>Mentioned ${topic.frequency} time(s)</small>
                                    </li>
                                `;
                            });
                            html += `</ul></div>`;
                        }

                        // Notes
                        if (person.notes) {
                            html += `
                                <div class="info-section">
                                    <h4>Notes</h4>
                                    <div class="info-item">${person.notes}</div>
                                </div>
                            `;
                        }

                        personInfoDiv.innerHTML = html;
                    }
                })
                .catch(error => {
                    console.error('Error fetching person info:', error);
                });
        }

        // Update every 1 second
        setInterval(updatePersonInfo, 1000);

        // Initial update
        updatePersonInfo();
    </script>
</body>
</html>
